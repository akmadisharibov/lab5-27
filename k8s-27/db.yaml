apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef: {name: web-config, key: DB_USER}
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef: {name: web-config, key: DB_NAME}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: web-secret, key: DB_PASSWORD}
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
  - port: 5432
